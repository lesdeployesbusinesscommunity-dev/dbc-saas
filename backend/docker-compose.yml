# Environnement de développement local uniquement.
# N'est jamais utilisé en production — voir Dockerfile pour le déploiement.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dbc
      POSTGRES_PASSWORD: dbc
      POSTGRES_DB: dbc_dev
    ports:
      - "5433:5432"
    volumes:
      - dbc_postgres_data:/var/lib/postgresql/data
      - ./docker/init-extensions.sql:/docker-entrypoint-initdb.d/init-extensions.sql

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  dbc_postgres_data:
